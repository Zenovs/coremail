<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f3f2f1" />
  <meta name="description" content="CoreMail Desktop - Minimaler E-Mail-Client" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>CoreMail Desktop</title>
  <script src="%PUBLIC_URL%/theme-boot.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    /* v8.0: Hintergrund folgt dem gespeicherten Theme (hell = Standard),
       damit beim Start kein dunkler/heller Blitz entsteht. Das Attribut
       data-mode wird gleich im Script unten gesetzt und von React übernommen. */
    html { background-color: #ffffff; }
    html[data-mode="dark"] { background-color: #292929; }
    body {
      background-color: transparent;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
